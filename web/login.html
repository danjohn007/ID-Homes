<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta id="themeColor" name="theme-color" content="#091020">

  <title>Acceso | ID Homes</title>

  <link
    rel="stylesheet"
    href="css/login.css?v=20260824-homes1"
  >
</head>

<body class="theme-night">

  <!-- =====================================================
       AMBIENTACIÓN
  ====================================================== -->

  <div class="ambient" aria-hidden="true">

    <div class="orb"></div>
    <div class="orb-haze"></div>

    <div class="stars">
      <i></i>
      <i></i>
      <i></i>
      <i></i>
      <i></i>
    </div>

    <div class="birds">
      <span class="bird bird-one"></span>
      <span class="bird bird-two"></span>
    </div>

    <div class="cloud cloud-one"></div>
    <div class="cloud cloud-two"></div>

  </div>


  <!-- =====================================================
       LOGIN
  ====================================================== -->

  <main class="login-shell">

    <section
      class="login-layout"
      aria-label="Acceso a ID Homes"
    >

      <!-- MARCA / PRESENTACIÓN -->

      <div class="visual-copy">

        <div class="brand-wrap">

          <picture>

            <source
              id="logoSource"
              srcset="assets/logo-id-homes-dark.png"
            >

            <img
              id="brandLogo"
              src="assets/logo-id-homes-dark.png"
              alt="ID Homes"
            >

          </picture>

        </div>


        <div class="desktop-intro">

          <span
            class="eyebrow"
            id="timeEyebrow"
          >
            Tu hogar conectado
          </span>

          <h1>
            Control inteligente,<br>
            simple y seguro.
          </h1>

          <p>
            Administra tus espacios y dispositivos
            desde un mismo lugar.
          </p>

        </div>

      </div>


      <!-- TARJETA LOGIN -->

      <section
        class="login-card"
        aria-labelledby="loginTitle"
      >

        <header class="login-heading">

          <p
            class="eyebrow mobile-eyebrow"
            id="mobileTimeEyebrow"
          >
            ID Homes
          </p>

          <h2 id="loginTitle">
            Hola de nuevo
          </h2>

          <p>
            Entra para controlar tu hogar.
          </p>

        </header>


        <!-- LOGIN REAL -->

        <form
          id="loginForm"
          class="login-form"
        >

          <label class="field">

            <span class="sr-only">
              Correo
            </span>

            <input
              name="email"
              type="email"
              maxlength="160"
              autocomplete="username"
              inputmode="email"
              placeholder="Correo"
              required
              autofocus
            >

          </label>


          <label class="field password-field">

            <span class="sr-only">
              Contraseña
            </span>

            <input
              id="passwordInput"
              name="password"
              type="password"
              maxlength="200"
              autocomplete="current-password"
              placeholder="Contraseña"
              required
            >


            <button
              id="passwordToggle"
              class="password-toggle"
              type="button"
              aria-label="Mostrar contraseña"
              title="Mostrar contraseña"
            >

              <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
              >

                <path
                  d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"
                ></path>

                <circle
                  cx="12"
                  cy="12"
                  r="2.8"
                ></circle>

              </svg>

            </button>

          </label>


          <p
            class="form-message"
            id="loginMessage"
            aria-live="polite"
          ></p>


          <button
            class="primary-button"
            type="submit"
          >
            <span>
              Iniciar sesión
            </span>
          </button>

        </form>


        <!-- ESTADO -->

        <div class="secure-line">

          <span class="secure-dot"></span>

          <span>
            Conexión segura
          </span>

        </div>


        <!-- =================================================
             CONFIGURACIÓN INICIAL
             SE CONSERVA LA FUNCIONALIDAD ORIGINAL
        ================================================== -->

        <button
          class="setup-toggle"
          id="setupToggle"
          type="button"
          aria-expanded="false"
        >
          Configuración inicial
        </button>


        <form
          class="setup-form"
          id="setupForm"
          hidden
        >

          <div class="setup-heading">

            <h3>
              Crear administrador inicial
            </h3>

            <span>
              Disponible únicamente antes de crear
              el primer usuario.
            </span>

          </div>


          <label class="setup-field">

            <span>
              Correo del cliente registrado
            </span>

            <input
              name="cliente_email"
              type="email"
              maxlength="160"
              autocomplete="off"
              required
            >

          </label>


          <label class="setup-field">

            <span>
              Nombre del administrador
            </span>

            <input
              name="nombre"
              type="text"
              minlength="2"
              maxlength="100"
              autocomplete="name"
              required
            >

          </label>


          <label class="setup-field">

            <span>
              Correo de acceso
            </span>

            <input
              name="email"
              type="email"
              maxlength="160"
              autocomplete="username"
              required
            >

          </label>


          <label class="setup-field">

            <span>
              Contraseña
            </span>

            <input
              name="password"
              type="password"
              minlength="8"
              maxlength="200"
              autocomplete="new-password"
              required
            >

          </label>


          <label class="setup-field">

            <span>
              Token de instalación
            </span>

            <input
              name="setup_token"
              type="password"
              minlength="32"
              maxlength="200"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
              required
            >

          </label>


          <p
            class="form-message"
            id="setupMessage"
            aria-live="polite"
          ></p>


          <button
            class="primary-button setup-submit"
            type="submit"
          >
            Crear administrador
          </button>

        </form>

      </section>

    </section>

  </main>


  <script
    src="js/login.js?v=20260824-homes1"
    defer
  ></script>

</body>
</html>
